<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RefundBot - Customer Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 20px;
            opacity: 0.9;
        }

        .users-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1000px;
            width: 100%;
        }

        .user-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .user-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .user-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 48px;
            font-weight: 700;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .user-name {
            font-size: 28px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .user-email {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 20px;
        }

        .user-orders {
            display: inline-block;
            padding: 8px 16px;
            background: #f3f4f6;
            border-radius: 20px;
            font-size: 13px;
            color: #6b7280;
            font-weight: 500;
        }

        .admin-link {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .admin-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 60px;
            text-align: center;
            color: white;
            opacity: 0.8;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <a href="dashboard.html" class="admin-link">📊 Dashboard</a>

    <div class="header">
        <h1>🤖 RefundBot</h1>
        <p>AI-Powered Customer Support Agent</p>
    </div>

    <div class="users-container">
        <div class="user-card" onclick="selectUser('ankit@example.com', 'Ankit')">
            <div class="user-avatar">A</div>
            <div class="user-name">Ankit Kumar</div>
            <div class="user-email">ankit@example.com</div>
            <div class="user-orders">2 Orders</div>
        </div>

        <div class="user-card" onclick="selectUser('rajesh@example.com', 'Rajesh')">
            <div class="user-avatar">R</div>
            <div class="user-name">Rajesh Singh</div>
            <div class="user-email">rajesh@example.com</div>
            <div class="user-orders">2 Orders</div>
        </div>

        <div class="user-card" onclick="selectUser('priya@example.com', 'Priya')">
            <div class="user-avatar">P</div>
            <div class="user-name">Priya Sharma</div>
            <div class="user-email">priya@example.com</div>
            <div class="user-orders">1 Order</div>
        </div>
    </div>

    <div class="footer">
        <p>Select a user to view their orders and start a conversation</p>
    </div>

    <script>
        function selectUser(email, name) {
            // Navigate to orders page
            window.location.href = `orders.html?email=${encodeURIComponent(email)}&name=${encodeURIComponent(name)}`;
        }
    </script>
</body>
</html>
