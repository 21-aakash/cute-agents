[project]
name = "careerops-ai"
version = "0.1.0"
description = "Autonomous Career Due-Diligence & Deep Research Agent with LangGraph, Qdrant, and Postgres"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "openai>=1.0.0",
    "ollama>=0.4.0",
    "ddgs>=9.14.4",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "ragas==0.4.3",
    "datasets>=5.0.1",
    "langfuse>=2.0.0",
    "langsmith>=0.1.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "domain", "graph", "services", "db"]
